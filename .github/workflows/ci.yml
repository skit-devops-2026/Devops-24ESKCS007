name: CI Pipeline

on:
  push:
    branches: [ main, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Inspect Runtime Environment
        run: |
          echo "=== Node & NPM Versions ==="
          node -v
          npm -v
          echo "=== Workspace Contents ==="
          ls -la

      - name: Code Quality & Syntax Validation
        run: npm run lint

      - name: Run Automated Test Suite
        run: npm test

      - name: Pipeline Execution Summary
        if: always()
        run: |
          echo "=========================================="
          echo "CI Pipeline Execution Finished Successfully"
          echo "Commit: ${{ github.sha }}"
          echo "Ref:    ${{ github.ref }}"
          echo "Status: ${{ job.status }}"
          echo "=========================================="
