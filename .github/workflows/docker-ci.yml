name: Docker CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t todo-practice .

      - name: Run tests inside the container
        run: docker run --rm todo-practice npm test

      - name: Tag the image with the commit SHA
        run: docker tag todo-practice todo-practice:${{ github.sha }}

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag for GHCR
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/todo-practice"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker tag todo-practice "$IMAGE_NAME:${{ github.sha }}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Push to GHCR
        run: docker push "$IMAGE_NAME:${{ github.sha }}"
